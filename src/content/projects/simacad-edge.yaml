title: SIMACAD-Edge
summary: Monitoreo ambiental y control de acceso para micro data centers de borde.
description: Prototipo embebido de seguridad y monitoreo integrado. Combina control de acceso RFID, detección de monóxido de carbono con ventilación automática, detección de intrusión PIR y un dashboard SCADA en Python con registro persistente en SQLite.
category: systems
context: Proyecto académico · Sistemas embebidos
image: ../../assets/projects/project-simacad-edge.webp
technologies: [python, cpp, arduino, sqlite, matplotlib]
highlights:
  - Control de acceso por tarjeta RFID con seguimiento de ocupación y lógica anti-tailgating.
  - Detección de CO con activación automática del ventilador.
  - 'Interfaz SCADA multi-pestaña: dashboard en tiempo real, histórico, estadísticas y configuración.'
  - Modo simulación para probar sin hardware físico.
  - Diseño referenciado a los estándares ASHRAE TC 9.9.
