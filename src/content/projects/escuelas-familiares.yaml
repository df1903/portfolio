title: Escuelas Familiares
summary: Plataforma que conecta familias y escuelas con un repositorio educativo.
description: Plataforma para fortalecer la relación entre familias y escuelas. Facilita el acceso y la gestión de información educativa para docentes, practicantes y directivos, consolidando informes de práctica, materiales educativos y artículos de investigación.
category: web
context: Proyecto académico · Backend + frontend
image: ../../assets/projects/project-escuelas-familiares.webp
technologies:
  [typescript, nodejs, nestjs, mongodb, supabase, react, tailwindcss, docker, github-actions]
highlights:
  - API REST con persistencia en MongoDB.
  - Almacenamiento de archivos en Supabase y notificaciones por correo.
  - Gestión de información para múltiples roles (docentes, practicantes, directivos).
  - Workflows automatizados con GitHub Actions.
