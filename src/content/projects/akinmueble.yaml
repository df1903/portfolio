highlights:
  - Tres microservicios con responsabilidades separadas y bases de datos propias (MongoDB y MySQL).
  - Microservicio de seguridad con autenticación y autorización.
  - Notificaciones en C# con SendGrid y AWS.
  - APIs documentadas con OpenAPI y servicios contenedorizados con Docker.
