title: Akinmueble
summary: Plataforma inmobiliaria con arquitectura de microservicios.
description: Sitio inmobiliario construido con tres microservicios independientes (seguridad, lógica de negocio y notificaciones) y un frontend Angular. Cubre gestión de propiedades, autenticación y autorización, y envío de notificaciones.
category: web
context: Proyecto académico · 4 repositorios
image: ../../assets/projects/project-akinmueble.webp
technologies: [typescript, angular, loopback, mongodb, mysql, csharp, docker, aws, openapi]
highlights:
  - Tres microservicios con responsabilidades separadas y bases de datos propias (MongoDB y MySQL).
  - Microservicio de seguridad con autenticación y autorización.
  - Notificaciones en C# con SendGrid y AWS.
  - APIs documentadas con OpenAPI y servicios contenedorizados con Docker.
