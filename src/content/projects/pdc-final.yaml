en:
  title: 'Metagenomic scoring on HPC'
  summary: 'Random search over a 3D simplex, parallelized on CPU, cluster and GPU.'
  description: 'A high-performance computing project that maximizes AUC in the binary classification of metagenomic samples. It implements the same algorithm with progressive parallelism (multicore Python, C + OpenMP, C + MPI and CUDA) and compares their performance.'
  context: 'Concurrent, Distributed and Parallel Programming · Universidad de Caldas'
  highlights:
    - 'Four implementations of the same algorithm: sequential/multicore, OpenMP, MPI and CUDA.'
    - 'Benchmarking framework with performance metrics across implementations.'
    - 'Consistency validation protocol (ΔAUC < 1e-4) between versions.'
    - 'Traceability through automatic logging of AI agent sessions.'
