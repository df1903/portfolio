title: 'Fragmento: El Restaurador de Sombras'
summary: Plataformas 3D de exploración en tercera persona hecho en Unity 6.
description: Videojuego para PC donde Kael, un pequeño espíritu guardián, recorre un santuario de islas flotantes y absorbe siete Fragmentos del Núcleo; cada uno reconstruye una parte del mundo hasta abrir el Portal de Salida. Desarrollado en equipo de dos personas.
category: games
context: Desarrollo de Videojuegos · Universidad de Caldas · En desarrollo
coverIcon: simple-icons:unity
technologies: [unity, csharp]
highlights:
  - Unity 6 con Universal Render Pipeline, Input System y Cinemachine.
  - Escena generada por script para un flujo de trabajo reproducible en equipo.
  - 15 pruebas automatizadas PlayMode con Unity Test Framework.
  - Soporte de teclado, ratón y mando.
